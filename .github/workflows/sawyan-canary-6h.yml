name: SAWYAN 6-Hour Production & Staging Synthetic Canary

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  synthetic-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Live Production & Staging Synthetic Canary
        run: python3 database/verify_full_lifecycle_50_members_e2e.py --canary
