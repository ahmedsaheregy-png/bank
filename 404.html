<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#047857">
  <title>الصفحة غير موجودة (404) — SAWYAN</title>
  <link rel="icon" type="image/svg+xml" href="shared/assets/sawyan-icon.svg">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #f8fafc 0%, #ecfdf5 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(4, 120, 87, 0.10);
      border: 1px solid #d1fae5;
    }
    .code {
      font-size: 64px;
      font-weight: 900;
      color: #047857;
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #064e3b; }
    p { font-size: 15px; color: #475569; line-height: 1.8; margin-bottom: 24px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    a.btn:hover { transform: translateY(-1px); opacity: 0.95; }
    a.primary { background: #047857; color: #ffffff; }
    a.secondary { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    a.ghost { background: #f8fafc; color: #334155; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>عذراً، هذه الصفحة غير متوفرة</h1>
    <p>ربما تم نقل الرابط أو تحديثه. يمكنك العودة إلى الصفحة الرئيسية لمنصة SAWYAN أو تجربة النسخة الاستعراضية التفاعلية أو التواصل مع الدعم.</p>
    <div class="actions">
      <a class="btn primary" href="index.html">العودة للرئيسية</a>
      <a class="btn secondary" href="preview/index.html">بيئة التجربة</a>
      <a class="btn ghost" href="public/contact.html">تواصل معنا</a>
    </div>
  </main>
</body>
</html>
