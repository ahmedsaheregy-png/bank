<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - عضو | SAWYAN</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/svg+xml" href="../shared/assets/sawyan-icon.svg">
    <link rel="stylesheet" href="../shared/css/variables.css?v=20261121_launch">
    <link rel="stylesheet" href="../shared/css/logo.css?v=20261121_launch">
    <link rel="stylesheet" href="../shared/css/ui-feedback.css?v=20261121_launch">
    <link rel="stylesheet" href="css/auth.css?v=20261121_launch">
    <link rel="stylesheet" href="../css/bidi-support.css?v=20261121_launch">
    <style>
        .pw-wrap { position: relative; display: flex; align-items: center; }
        .pw-wrap input { width: 100%; padding-inline-end: 42px; }
        .pw-eye-btn { position: absolute; inset-inline-end: 8px; border: none; background: transparent; cursor: pointer; font-size: 1rem; padding: 4px; color: #475569; }
    </style>
</head>

<body>
    <header class="auth-top-nav" role="banner">
        <div class="auth-top-nav-inner">
            <a href="../index.html" class="nav-logo sawyan-home-logo" data-sawyan-logo="default" aria-label="SAWYAN — العودة للصفحة الرئيسية" title="العودة للصفحة الرئيسية">
                <strong style="font-family:'Poppins',sans-serif;font-weight:800;color:#0f2744;font-size:1.25rem;">SAWYAN</strong>
            </a>
            <a href="../index.html" class="auth-home-pill">🏠 الرئيسية</a>
        </div>
    </header>
    <div class="auth-container">
        <div class="auth-card">
            <div id="logoContainer" class="logo-section" data-sawyan-logo="default"></div>

            <h1>تسجيل الدخول</h1>
            <p class="subtitle">ادخل بكود العضوية أو البريد أو الهاتف</p>

            <div id="demoQuickLoginBox" style="display:none; margin:0 0 16px; padding:12px; border-radius:12px; background:#fffbeb; border:1.5px dashed #f59e0b; text-align:center;">
                <p style="margin:0 0 8px; font-size:0.84rem; color:#92400e; font-weight:700;">🧪 متاح في الموقع الموازي للتجربة فقط (Schema: sawyan_demo)</p>
                <button type="button" id="demoQuickLoginBtn" class="btn btn-outline btn-block" style="border-color:#d97706; color:#92400e; font-weight:800;">
                    ⚡ دخول تجريبي كقائد الشجرة (#1 — أحمد ساهر)
                </button>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="identifier">كود العضوية أو البريد الإلكتروني أو الهاتف</label>
                    <input type="text" id="identifier" autocomplete="username" required class="form-control"
                        placeholder="مثال: 1 أو email@domain.com">
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="pw-wrap">
                        <input type="password" id="password" autocomplete="current-password" required minlength="8" class="form-control"
                            placeholder="أدخل كلمة المرور (8 أحرف على الأقل)">
                        <button type="button" class="pw-eye-btn" aria-label="إظهار أو إخفاء كلمة المرور" onclick="const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁️':'🙈';">👁️</button>
                    </div>
                </div>

                <div id="loginErrorBox" style="display:none;background:#fef2f2;border:1.5px solid #fecaca;color:#991b1b;padding:10px 14px;border-radius:10px;font-size:0.86rem;font-weight:700;margin-bottom:12px;"></div>
                <button type="submit" id="loginBtn" class="btn btn-primary btn-block">دخول</button>

                <div class="auth-footer">
                    <p><a href="forgot-password.html" class="forgot-link">نسيت كلمة المرور؟</a></p>
                    <p>ليس لديك حساب؟ <a href="register.html">سجل الآن</a></p>
                    <p style="margin-top: 1rem;"><a href="../index.html">← العودة للرئيسية</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="../shared/components/logo.js?v=20261121_launch"></script>
    <script src="../shared/components/flags.js?v=20261121_launch"></script>
    <script src="../shared/i18n/i18n.js?v=20261121_launch"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/config/supabase.js?v=20261121_launch"></script>
    <script src="../shared/api/sawyan-api.js?v=20261121_launch"></script>
    <script src="../shared/components/ui-feedback.js?v=20261121_launch"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.SAWYAN && window.SAWYAN.Logo) {
                document.getElementById('logoContainer').innerHTML = window.SAWYAN.Logo.full();
            }

            function showErr(raw, extraPayload) {
                const box = document.getElementById('loginErrorBox');
                const m = String(raw || (extraPayload && extraPayload.error_code) || '');
                let msg = m || 'بيانات الدخول غير صحيحة';
                if (m.includes('INVALID_CREDENTIALS')) {
                    msg = 'بيانات الدخول غير صحيحة — تأكد من كود العضوية أو الهاتف أو البريد وكلمة المرور.';
                }
                else if (m.includes('ROOT_PORTAL_ACCESS_FORBIDDEN')) msg = 'حساب الجذر #0 مخصص للإدارة العليا ولا يُفتح من بوابة الأعضاء.';
                else if (m.includes('MEMBER_ACCOUNT_INACTIVE')) msg = 'الحساب غير نشط أو مجمّد حالياً — تواصل مع الدعم الفني عبر واتساب 905376744337+.';
                else if (m.includes('WEAK_OR_DEFAULT_PASSWORD_REJECTED')) msg = 'كلمة المرور الافتراضية 123456 مرفوضة أمنياً.';
                else if (m.includes('MISSING_CREDENTIALS')) msg = 'يرجى إدخال معرف الحساب وكلمة المرور.';
                if (box) {
                    box.textContent = '❌ ' + msg;
                    box.style.display = 'block';
                } else if (window.SAWYAN && window.SAWYAN.UI) {
                    window.SAWYAN.UI.toast('❌ ' + msg, 'error');
                }
            }

            async function performLogin(identifier, password) {
                const btn = document.getElementById('loginBtn');
                const box = document.getElementById('loginErrorBox');
                if (box) { box.style.display = 'none'; box.textContent = ''; }
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = 'جاري التحقق...';
                }
                try {
                    for (let i = 0; i < 30 && (!window.SAWYAN || !window.SAWYAN.supabase); i++) {
                        await new Promise(r => setTimeout(r, 100));
                    }
                    const res = await window.SAWYAN.API.authenticateMemberLogin(identifier, password);
                    if (!res || res.success !== true || !res.member) {
                        showErr(res?.error_code || 'INVALID_CREDENTIALS', res);
                        return;
                    }
                    window.SAWYAN.API.saveMemberSession(res.member, res.session_token);
                    window.location.replace('dashboard.html');
                } catch (error) {
                    showErr(error.message, error.payload);
                } finally {
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = 'دخول';
                    }
                }
            }

            if (window.SAWYAN && window.SAWYAN.API) {
                try {
                    const qs0 = new URLSearchParams(window.location.search);
                    if (!qs0.get('quick') && !qs0.get('switch')) {
                        const existingMem = window.SAWYAN.API.getSavedMember && window.SAWYAN.API.getSavedMember();
                        const existingTok = window.SAWYAN.API.getMemberSessionToken && window.SAWYAN.API.getMemberSessionToken();
                        if (existingMem && existingMem.id && existingTok) {
                            window.location.replace('dashboard.html');
                            return;
                        }
                    }
                } catch (_e) {}
            }
            if (window.SAWYAN && window.SAWYAN.API && window.SAWYAN.API.isDemoMode()) {
                const demoBox = document.getElementById('demoQuickLoginBox');
                const demoBtn = document.getElementById('demoQuickLoginBtn');
                if (demoBox) demoBox.style.display = 'block';
                if (demoBtn) {
                    demoBtn.addEventListener('click', async function () {
                        await performLogin('1', 'Demo@Sawyan2026');
                    });
                }
                if (new URLSearchParams(window.location.search).get('quick') === 'member') {
                    performLogin('1', 'Demo@Sawyan2026');
                }
            }

            document.getElementById('loginForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                const identifier = document.getElementById('identifier').value.trim();
                const password = document.getElementById('password').value;
                await performLogin(identifier, password);
            });
        });
    </script>
</body>

</html>
