<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - تاجر | SAWYAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/svg+xml" href="../shared/assets/sawyan-icon.svg">
    <link rel="stylesheet" href="../shared/css/variables.css?v=20261121_launch">
    <link rel="stylesheet" href="../shared/css/logo.css?v=20261121_launch">
    <link rel="stylesheet" href="../shared/css/ui-feedback.css?v=20261121_launch">
    <link rel="stylesheet" href="../member-dashboard/css/auth.css?v=20261121_launch">
</head>

<body>
    <header class="auth-top-nav" role="banner">
        <div class="auth-top-nav-inner">
            <a href="../index.html" class="nav-logo sawyan-home-logo" data-sawyan-logo="default" aria-label="SAWYAN — العودة للصفحة الرئيسية" title="العودة للصفحة الرئيسية">
                <strong style="font-family:'Poppins',sans-serif;font-weight:800;color:#0f2744;font-size:1.25rem;">SAWYAN</strong>
            </a>
            <a href="../index.html" class="auth-home-pill">🏠 الرئيسية</a>
        </div>
    </header>
    <div class="auth-container">
        <div class="auth-card">
            <div id="logoContainer" class="logo-section" data-sawyan-logo="default"></div>

            <h1>🏪 تسجيل الدخول — بوابة التاجر</h1>
            <p class="subtitle">أدخل كود التاجر أو البريد الإلكتروني أو الهاتف المسجل</p>

            <div id="demoMerchantLoginBox" style="display:none;margin:0 0 16px;padding:12px;border-radius:12px;background:#fffbeb;border:1.5px dashed #f59e0b;text-align:center;">
                <p style="margin:0 0 8px;font-size:0.84rem;color:#92400e;font-weight:700;">🧪 متاح في الموقع الموازي للتجربة فقط (Schema: sawyan_demo)</p>
                <div style="display:grid;gap:8px;">
                    <button type="button" id="demoEgMerchantBtn" class="btn btn-outline btn-block" style="border-color:#d97706;color:#92400e;font-weight:800;">
                        ⚡ دخول تجريبي — سوبر ماركت النخبة مصر (M-EG-001 • كاشير EMP-01 PIN: 2580)
                    </button>
                    <button type="button" id="demoTrMerchantBtn" class="btn btn-outline btn-block" style="border-color:#0284c7;color:#0369a1;font-weight:800;">
                        ⚡ دخول تجريبي — مطعم إسطنبول الذهبي تركيا (M-TR-001)
                    </button>
                </div>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label>كود التاجر أو البريد الإلكتروني أو الهاتف</label>
                    <input type="text" id="identifier" required class="form-control" placeholder="مثال: M-EG-001 أو email@domain.com">
                </div>

                <div class="form-group">
                    <label>كلمة المرور (8 أحرف على الأقل)</label>
                    <input type="password" id="password" required minlength="8" class="form-control" placeholder="أدخل كلمة المرور المشفرة">
                </div>

                <div id="loginErrorBox" style="display:none;background:#fef2f2;border:1.5px solid #fecaca;color:#991b1b;padding:10px 14px;border-radius:10px;font-size:0.86rem;font-weight:700;margin-bottom:12px;"></div>
                <button type="submit" id="loginBtn" class="btn btn-primary btn-block">دخول لوحة التاجر ونقطة البيع</button>

                <div class="auth-footer">
                    <p><a href="forgot-password.html" class="forgot-link">نسيت كلمة المرور؟</a></p>
                    <p>ليس لديك حساب تاجر؟ <a href="register.html">سجل متجرك في 3 دقائق</a></p>
                    <p style="margin-top: 1rem;"><a href="../index.html">← العودة للرئيسية</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="../shared/components/logo.js?v=20261121_launch"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/config/supabase.js?v=20261121_launch"></script>
    <script src="../shared/api/sawyan-api.js?v=20261121_launch"></script>
    <script src="../shared/components/ui-feedback.js?v=20261121_launch"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.SAWYAN && window.SAWYAN.Logo) {
                document.getElementById('logoContainer').innerHTML = window.SAWYAN.Logo.full();
            }

            function showErr(raw, extraPayload) {
                const box = document.getElementById('loginErrorBox');
                const m = String(raw || (extraPayload && extraPayload.error_code) || '');
                let msg = m || 'بيانات دخول التاجر غير صحيحة';
                if (m.includes('INVALID_MERCHANT_CREDENTIALS')) {
                    msg = 'بيانات دخول التاجر غير صحيحة — تأكد من كود التاجر أو البريد أو الهاتف وكلمة المرور.';
                }
                else if (m.includes('MERCHANT_ACCOUNT_INACTIVE') || m.includes('MERCHANT_ACCOUNT_REJECTED') || m.includes('MERCHANT_ACCOUNT_BANNED')) msg = 'حساب التاجر موقوف أو غير نشط حالياً — تواصل مع علاقات التجار عبر واتساب 905376744337+.';
                else if (m.includes('WEAK_OR_DEFAULT_PASSWORD_REJECTED')) msg = 'كلمة المرور الافتراضية 123456 مرفوضة أمنياً.';
                else if (m.includes('CREDENTIALS_REQUIRED')) msg = 'يرجى إدخال معرف التاجر وكلمة المرور.';
                if (box) {
                    box.textContent = '❌ ' + msg;
                    box.style.display = 'block';
                } else if (window.SAWYAN && window.SAWYAN.UI) {
                    window.SAWYAN.UI.toast('❌ ' + msg, 'error');
                }
            }

            async function performMerchantLogin(identifier, password) {
                const btn = document.getElementById('loginBtn');
                const box = document.getElementById('loginErrorBox');
                if (box) { box.style.display = 'none'; box.textContent = ''; }
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = '⏳ جاري التحقق...';
                }
                try {
                    for (let i = 0; i < 30 && (!window.SAWYAN || !window.SAWYAN.supabase); i++) {
                        await new Promise(r => setTimeout(r, 100));
                    }
                    const res = await window.SAWYAN.API.authenticateMerchantLogin(identifier, password);
                    if (!res || res.success !== true || !res.merchant) {
                        showErr(res?.error_code || 'INVALID_MERCHANT_CREDENTIALS', res);
                        return;
                    }
                    window.SAWYAN.API.saveMerchantSession(res.merchant, res.session_token);
                    window.location.href = 'dashboard.html';
                } catch (err) {
                    showErr(err.message, err.payload);
                } finally {
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = 'دخول لوحة التاجر ونقطة البيع';
                    }
                }
            }

            if (window.SAWYAN && window.SAWYAN.API && window.SAWYAN.API.isDemoMode()) {
                const box = document.getElementById('demoMerchantLoginBox');
                if (box) box.style.display = 'block';
                document.getElementById('demoEgMerchantBtn')?.addEventListener('click', () => performMerchantLogin('M-EG-001', 'Demo@Merchant2026'));
                document.getElementById('demoTrMerchantBtn')?.addEventListener('click', () => performMerchantLogin('M-TR-001', 'Demo@Merchant2026'));
                if (new URLSearchParams(window.location.search).get('quick') === 'merchant') {
                    performMerchantLogin('M-EG-001', 'Demo@Merchant2026');
                }
            }

            document.getElementById('loginForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                await performMerchantLogin(
                    document.getElementById('identifier').value.trim(),
                    document.getElementById('password').value
                );
            });
        });
    </script>
</body>

</html>
