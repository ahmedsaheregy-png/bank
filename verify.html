<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من عملية - SAWYAN BANK</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: #111827;
        }
        .verify-container {
            background: #fff;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .verify-header {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: #fff;
            padding: 24px 20px;
            text-align: center;
        }
        .verify-header h1 {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }
        .verify-header p {
            opacity: 0.9;
            font-size: 0.85rem;
        }
        .verify-body {
            padding: 24px 20px;
        }
        .verify-status {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .verify-status.loading {
            background: #eff6ff;
            color: #1e40af;
        }
        .verify-status.success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .verify-status.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .verify-status .icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        .verify-status h2 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }
        .verify-status p {
            font-size: 0.85rem;
            opacity: 0.85;
        }
        .verify-details {
            background: #f9fafb;
            border-radius: 12px;
            padding: 16px;
        }
        .verify-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #e5e7eb;
            font-size: 0.9rem;
        }
        .verify-row:last-child {
            border-bottom: none;
        }
        .verify-row-label {
            color: #6b7280;
        }
        .verify-row-value {
            color: #111827;
            font-weight: 600;
            text-align: left;
            direction: ltr;
        }
        .verify-row-value.code {
            font-family: 'Courier New', monospace;
            background: #f3f4f6;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .verify-footer {
            text-align: center;
            padding: 16px 20px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            font-size: 0.8rem;
            color: #6b7280;
        }
        .verify-footer a {
            color: #10B981;
            text-decoration: none;
            font-weight: 600;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #bfdbfe;
            border-top-color: #1e40af;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="verify-container">
        <div class="verify-header">
            <h1>🔍 التحقق من عملية</h1>
            <p>SAWYAN BANK — نظام توثيق العمليات</p>
        </div>

        <div class="verify-body">
            <div id="verifyStatus" class="verify-status loading">
                <div class="spinner"></div>
                <h2>جاري التحقق...</h2>
                <p>يتم البحث عن العملية في قاعدة البيانات</p>
            </div>

            <div id="verifyDetails" style="display: none;"></div>
        </div>

        <div class="verify-footer">
            <p>هل أنت عضو في SAWYAN BANK؟ <a href="member-dashboard/login.html">سجّل دخولك</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="shared/config/supabase.js"></script>
    <script>
        async function verifyTransaction() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');

            const statusEl = document.getElementById('verifyStatus');
            const detailsEl = document.getElementById('verifyDetails');

            if (!code) {
                statusEl.className = 'verify-status error';
                statusEl.innerHTML = `
                    <div class="icon">⚠️</div>
                    <h2>الرابط غير صحيح</h2>
                    <p>لم يتم تحديد كود عملية للتحقق منه</p>
                `;
                return;
            }

            if (!window.SAWYAN || !window.SAWYAN.supabase) {
                statusEl.className = 'verify-status error';
                statusEl.innerHTML = `
                    <div class="icon">⚠️</div>
                    <h2>تعذّر الاتصال بقاعدة البيانات</h2>
                    <p>حاول مرة أخرى لاحقاً</p>
                `;
                return;
            }

            try {
                // البحث عن العملية بكودها — جلب بيانات التاجر والعميل
                const { data: transaction, error } = await window.SAWYAN.supabase
                    .from('transactions')
                    .select(`
                        *,
                        members (
                            member_code,
                            full_name
                        ),
                        merchants (
                            merchant_code,
                            business_name
                        )
                    `)
                    .eq('transaction_code', code)
                    .single();

                if (error || !transaction) {
                    statusEl.className = 'verify-status error';
                    statusEl.innerHTML = `
                        <div class="icon">❌</div>
                        <h2>العملية غير موجودة</h2>
                        <p>كود العملية ${code} غير مسجل في النظام</p>
                    `;
                    return;
                }

                // العملية موجودة — اعرض التفاصيل
                const statusText = {
                    'completed': { label: 'مكتملة ✓', color: '#10B981' },
                    'pending': { label: 'قيد المراجعة', color: '#f59e0b' },
                    'rejected': { label: 'مرفوضة', color: '#ef4444' }
                };
                const st = statusText[transaction.status] || { label: transaction.status, color: '#6b7280' };

                const dateStr = new Date(transaction.transaction_date || transaction.created_at)
                    .toLocaleString('ar-EG');

                statusEl.className = 'verify-status success';
                statusEl.innerHTML = `
                    <div class="icon">✅</div>
                    <h2>عملية موثّقة</h2>
                    <p>هذه عملية صحيحة في نظام SAWYAN BANK</p>
                `;

                detailsEl.style.display = 'block';
                detailsEl.innerHTML = `
                    <div class="verify-details">
                        <div class="verify-row">
                            <span class="verify-row-label">كود العملية:</span>
                            <span class="verify-row-value code">${transaction.transaction_code}</span>
                        </div>
                        <div class="verify-row">
                            <span class="verify-row-label">الحالة:</span>
                            <span class="verify-row-value" style="color: ${st.color};">${st.label}</span>
                        </div>
                        <div class="verify-row">
                            <span class="verify-row-label">التاريخ:</span>
                            <span class="verify-row-value">${dateStr}</span>
                        </div>
                        <div class="verify-row">
                            <span class="verify-row-label">التاجر:</span>
                            <span class="verify-row-value">${transaction.merchants?.business_name || '-'}</span>
                        </div>
                        <div class="verify-row">
                            <span class="verify-row-label">كود التاجر:</span>
                            <span class="verify-row-value">${transaction.merchants?.merchant_code || '-'}</span>
                        </div>
                        <div class="verify-row">
                            <span class="verify-row-label">العميل:</span>
                            <span class="verify-row-value">${transaction.members?.full_name || '-'}</span>
                        </div>
                        <div class="verify-row">
                            <span class="verify-row-label">كود العميل:</span>
                            <span class="verify-row-value">${transaction.members?.member_code || '-'}</span>
                        </div>
                        <div class="verify-row">
                            <span class="verify-row-label">المبلغ الإجمالي:</span>
                            <span class="verify-row-value">${parseFloat(transaction.total_amount).toFixed(2)} ج.م</span>
                        </div>
                        <div class="verify-row">
                            <span class="verify-row-label">نسبة العمولة:</span>
                            <span class="verify-row-value">${transaction.commission_percentage}%</span>
                        </div>
                        <div class="verify-row">
                            <span class="verify-row-label">إجمالي العمولة:</span>
                            <span class="verify-row-value">${parseFloat(transaction.commission_amount).toFixed(2)} ج.م</span>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error('Verify error:', err);
                statusEl.className = 'verify-status error';
                statusEl.innerHTML = `
                    <div class="icon">⚠️</div>
                    <h2>حدث خطأ</h2>
                    <p>${err.message || 'تعذّر التحقق من العملية'}</p>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', verifyTransaction);
    </script>
</body>

</html>
